server:
  port: 8095

spring:
  application:
    name: cloud-gateway
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 16MB
  cloud:
    gateway:
      forwarded:
        enabled: false
      x-forwarded:
        enabled: false
      httpclient:
        connect-timeout: 5000
        response-timeout: 90s
        websocket:
          max-frame-payload-length: 65536
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers Access-Control-Max-Age, RETAIN_FIRST
      routes:
        - id: customer-auth
          uri: lb://customer-service
          predicates:
            - Path=/api/auth/**
        - id: customer-profile
          uri: lb://customer-service
          predicates:
            - Path=/api/profile,/api/profile/**
        - id: inventory-catalog
          uri: lb://inventory-service
          predicates:
            - Path=/api/products/**,/api/categories/**
        - id: pharmacy-api
          uri: lb://pharmacy-service
          predicates:
            - Path=/api/**
          filters:
            - Retry=3
        - id: shipment-websocket
          uri: lb://shipment-service
          predicates:
            - Path=/ws/shipments,/ws/shipments/**
        - id: accounts-websocket
          uri: lb://gateway-service
          predicates:
            - Path=/ws/accounts,/ws/accounts/**
    loadbalancer:
      cache:
        ttl: 5s

app:
  jwt:
    secret: MedicineDrugstoreJwtSecretKeyMustBeAtLeast256BitsLongForHS256Algo
  rate-limit:
    enabled: true
    default-policy:
      capacity: 60
      refill-tokens: 30
      refill-period: 1s
    auth-policy:
      capacity: 10
      refill-tokens: 10
      refill-period: 1m
  throttle:
    enabled: true
    max-concurrent-global: 200
    max-concurrent-per-client: 16
    max-wait: 300ms
  load-balancer:
    default-max-load: 50
    services:
      customer-service: 80
      inventory-service: 120
      pharmacy-service: 40
      payment-service: 30
      notification-service: 20
      shipment-service: 50
      gateway-service: 40

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

info:
  app:
    name: Pharmacy Cloud Gateway
    description: Single entry point that routes client traffic to pharmacy microservices
    version: 1.0.0

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.springframework.cloud.gateway: INFO
    com.pharmacy.cloudgateway: INFO
