spring.application.name=pharmacy-service

spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8082

# Plain-text console and file logs (not JSON)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:--}] userId=%X{userId:-anonymous} email=%X{userEmail:--} name=%X{userName:--} role=%X{userRole:--} %logger{36} - %msg%n

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.metadata-map.max-load=40
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:--}] userId=%X{userId:-anonymous} email=%X{userEmail:--} name=%X{userName:--} role=%X{userRole:--} %logger{36} - %msg%n

info.app.name=Medicine Drugstore
info.app.description=Pharmacy e-commerce API
info.app.version=1.0.0

management.endpoints.web.base-path=/actuator
# Required by alert-support-dashboard remote APM scraper
management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.cluster=local
management.metrics.distribution.percentiles-histogram.http.server.requests=true

app.jwt.secret=MedicineDrugstoreJwtSecretKeyMustBeAtLeast256BitsLongForHS256Algo
app.jwt.expiration-ms=86400000

# Real inbox delivery (Gmail App Password, not the Gmail login password)
# Google Account → Security → 2-Step Verification → App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:emailsupportd13@gmail.com}
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${spring.mail.username}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=pharmacy-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topics.payment-commands=pharmacy.payment.commands
app.kafka.topics.payment-replies=pharmacy.payment.replies
app.kafka.topics.payment-events=pharmacy.payment.events
app.kafka.topics.notification-commands=pharmacy.notification.commands
app.kafka.topics.shipment-commands=pharmacy.shipment.commands
app.kafka.topics.shipment-replies=pharmacy.shipment.replies
app.kafka.topics.shipment-events=pharmacy.shipment.events
app.kafka.topics.stock-commands=pharmacy.stock.commands
app.kafka.topics.stock-replies=pharmacy.stock.replies
app.kafka.topics.inventory-events=pharmacy.inventory.events
app.kafka.topics.order-events=pharmacy.order.events
app.kafka.topics.fulfilment-events=pharmacy.fulfilment.events
app.kafka.topics.saga-dlt=pharmacy.saga.dlt
app.outbox.poll-ms=400

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
app.gateway-service.base-url=${GATEWAY_SERVICE_URL:http://localhost:8086}
app.customer-service.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8087}
app.inventory-service.base-url=${INVENTORY_SERVICE_URL:http://localhost:8088}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
app.health.max-pages=20
app.health.max-chars=80000

management.health.circuitbreakers.enabled=true
resilience4j.circuitbreaker.configs.outbound.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.outbound.slidingWindowSize=6
resilience4j.circuitbreaker.configs.outbound.minimumNumberOfCalls=3
resilience4j.circuitbreaker.configs.outbound.failureRateThreshold=50
resilience4j.circuitbreaker.configs.outbound.waitDurationInOpenState=15s
resilience4j.circuitbreaker.configs.outbound.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.outbound.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.outbound.ignoreExceptions=org.springframework.web.server.ResponseStatusException
resilience4j.circuitbreaker.instances.paymentGateway.baseConfig=outbound
resilience4j.circuitbreaker.instances.paymentGateway.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventoryService.baseConfig=outbound
resilience4j.circuitbreaker.instances.inventoryService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.customerService.baseConfig=outbound
resilience4j.circuitbreaker.instances.customerService.registerHealthIndicator=true

spring.http.converters.preferred-json-mapper=jackson2
