spring.application.name=notification-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.auto-commit=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.pharmacy.notification.event.NotificationCommand

app.kafka.topics.notification-commands=pharmacy.notification.commands
app.kafka.topics.saga-dlt=pharmacy.saga.dlt

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:emailsupportd13@gmail.com}
spring.mail.password=
app.mail.from=${spring.mail.username}

info.app.name=Pharmacy Notification Service
info.app.description=Kafka email notification processor for Medicine Drugstore
info.app.version=1.0.0

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.cluster=local
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.configs.outbound.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.outbound.slidingWindowSize=6
resilience4j.circuitbreaker.configs.outbound.minimumNumberOfCalls=3
resilience4j.circuitbreaker.configs.outbound.failureRateThreshold=50
resilience4j.circuitbreaker.configs.outbound.waitDurationInOpenState=15s
resilience4j.circuitbreaker.configs.outbound.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.outbound.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.smtp.baseConfig=outbound
resilience4j.circuitbreaker.instances.smtp.registerHealthIndicator=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.metadata-map.max-load=20
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
spring.http.converters.preferred-json-mapper=jackson2
