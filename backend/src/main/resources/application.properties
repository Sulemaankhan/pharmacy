spring.application.name=drugstore

spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8082

# Plain-text console and file logs (not JSON)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:--}] userId=%X{userId:-anonymous} email=%X{userEmail:--} name=%X{userName:--} role=%X{userRole:--} %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:--}] userId=%X{userId:-anonymous} email=%X{userEmail:--} name=%X{userName:--} role=%X{userRole:--} %logger{36} - %msg%n

info.app.name=Medicine Drugstore
info.app.description=Pharmacy e-commerce API
info.app.version=1.0.0

management.endpoints.web.base-path=/actuator
# Required by alert-support-dashboard remote APM scraper
management.endpoints.web.exposure.include=health,info,metrics,threaddump,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

app.jwt.secret=MedicineDrugstoreJwtSecretKeyMustBeAtLeast256BitsLongForHS256Algo
app.jwt.expiration-ms=86400000

# Real inbox delivery (Gmail App Password, not the Gmail login password)
# Google Account → Security → 2-Step Verification → App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:emailsupportd13@gmail.com}
spring.mail.password=${MAIL_PASSWORD:gqbuhbboiebkbswj}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${spring.mail.username}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
app.health.max-pages=20
app.health.max-chars=80000

