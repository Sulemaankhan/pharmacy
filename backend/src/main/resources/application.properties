spring.application.name=drugstore

spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8082

info.app.name=Medicine Drugstore
info.app.description=Pharmacy e-commerce API
info.app.version=1.0.0

management.endpoints.web.base-path=/actuator
# Required by alert-support-dashboard remote APM scraper
management.endpoints.web.exposure.include=health,info,metrics,threaddump,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

app.jwt.secret=MedicineDrugstoreJwtSecretKeyMustBeAtLeast256BitsLongForHS256Algo
app.jwt.expiration-ms=86400000
